services:
  inkframe-duo:
    build: .
    container_name: inkframe-duo
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Configure 1..N frames: "deviceId:Display Name[:optionalToken]"
      - INKFRAME_DEVICES=frame-wife:Wife's Desk Frame,frame-matt:Matt's Desk Frame
      # Optional: set a token or web PIN if exposing outside local network
      # - FRAME_TOKEN=
      # - WEB_PIN=
    volumes:
      - ./data:/data
